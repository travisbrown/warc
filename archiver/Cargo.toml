[package]
name = "warc-archiver"
description = "Archiving web pages over HTTP into the WACZ format"
authors.workspace = true
repository.workspace = true
documentation = "https://docs.rs/crate/warc-archiver/"
keywords = ["warc", "wacz", "web", "archive", "http"]
edition.workspace = true
rust-version.workspace = true
readme.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
chrono.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url.workspace = true
warc = { version = "0.4.0", path = "../core/", default-features = false }
warc-wacz = { version = "0.4.0", path = "../wacz/" }

[dev-dependencies]
# Integration tests inspect the raw WARC member to check the recorded index offsets.
zip.workspace = true
