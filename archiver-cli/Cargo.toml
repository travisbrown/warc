[package]
name = "warc-archiver-cli"
authors.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "warc-archiver"
path = "src/main.rs"
# Avoid a rustdoc output-filename collision with the `warc-archiver` library crate.
doc = false

[dependencies]
cli-helpers.workspace = true
indicatif.workspace = true
thiserror.workspace = true
warc-archiver = { version = "0.4.0", path = "../archiver/" }
