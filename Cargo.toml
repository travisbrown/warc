[workspace]
members = ["archiver", "archiver-cli", "core", "wacz"]
resolver = "3"

[workspace.package]
authors = ["Reza Akhavan <reza@akhavan.me>"]
repository = "https://github.com/jedireza/warc"
documentation = "https://docs.rs/crate/warc/"
keywords = ["warc", "web", "archive"]
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "MIT"
version = "0.4.0"

[workspace.dependencies]
chrono = "0.4"
cli-helpers = "0.1"
data-encoding = "2"
indexmap = "2"
indicatif = "0.18"
libflate = "2"
nom = "8"
# HTTP/1.1 only, so that recorded requests and responses match the wire format; response bodies
# are archived as received, so no decompression features are enabled.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
url = "2"
# Only the DEFLATE codec is needed: WARC and CDX members are stored, and gzip payloads are
# handled by `libflate` so that compressed members can be read as streams.
zip = { version = "7", default-features = false, features = ["deflate"] }
